name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Build one-file EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JapaneseAudioRenamer.spec

      - name: Smoke test the EXE
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          New-Item -ItemType Directory -Force smoke-test | Out-Null
          New-Item -ItemType File -Force "smoke-test\マインドブランド.mp3" | Out-Null
          $output = & ".\dist\JapaneseAudioRenamer.exe" ".\smoke-test" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "Mind Brand") {
            throw "EXE smoke test failed: expected 'Mind Brand' in output."
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseAudioRenamer-windows-x64
          path: dist/JapaneseAudioRenamer.exe
          if-no-files-found: error
          retention-days: 30
