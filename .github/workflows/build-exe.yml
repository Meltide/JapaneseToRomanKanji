name: Build Windows EXE

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：发布到这个 tag（例如 v1.2.3）；留空只构建，不发布"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build one-file EXEs
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JapaneseAudioRenamer.spec

      - name: Smoke test the CLI EXE
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          New-Item -ItemType Directory -Force smoke-test | Out-Null
          New-Item -ItemType File -Force "smoke-test\マインドブランド.mp3" | Out-Null
          $output = & ".\dist\JapaneseAudioRenamer.exe" ".\smoke-test" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "Mind Brand") {
            throw "CLI EXE smoke test failed: expected 'Mind Brand' in output."
          }

      - name: Smoke test the GUI EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\dist\JapaneseAudioRenamerGUI.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GUI EXE self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\JapaneseAudioRenamer.exe package\
          Copy-Item dist\JapaneseAudioRenamerGUI.exe package\
          Copy-Item LICENSE package\
          Copy-Item README.md package\
          Compress-Archive -Path package\* -DestinationPath dist\JapaneseAudioRenamer-windows-x64.zip -Force

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseAudioRenamer-windows-x64
          path: |
            dist/JapaneseAudioRenamer.exe
            dist/JapaneseAudioRenamerGUI.exe
            dist/JapaneseAudioRenamer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event.deleted != true && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "JapaneseToRomanKanji ${{ github.event.inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.event.inputs.release_tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/JapaneseAudioRenamer-windows-x64.zip
            dist/JapaneseAudioRenamer.exe
            dist/JapaneseAudioRenamerGUI.exe
            LICENSE
